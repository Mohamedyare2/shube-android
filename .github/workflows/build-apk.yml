name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: ./android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shube-App-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Commit and Push APK
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          cp android/app/build/outputs/apk/debug/app-debug.apk admin-dashboard/public/downloads/shube-latest.apk
          git add admin-dashboard/public/downloads/shube-latest.apk
          git commit -m "chore: auto-build Shube APK [skip ci]" || echo "No changes to commit"
          git push
