<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="50%" stop-color="#065F46" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="#10B981" stroke-width="4" stroke-opacity="0.3" />

  <!-- Outer subtle tech ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#10B981" stroke-width="2" stroke-dasharray="16 12" stroke-opacity="0.35" />

  <!-- Gold Crescent Vault Arch -->
  <path d="M 170 360 C 130 310 130 200 190 150 C 230 115 290 115 330 145 C 300 135 240 145 210 185 C 175 230 180 310 230 350 Z" 
        fill="url(#goldGrad)" opacity="0.9" filter="url(#glow)" />

  <!-- Modern Stylized "M" Architecture -->
  <!-- Left Pillar -->
  <rect x="156" y="180" width="38" height="180" rx="19" fill="url(#emeraldGrad)" />

  <!-- Right Pillar -->
  <rect x="318" y="180" width="38" height="180" rx="19" fill="url(#emeraldGrad)" />

  <!-- Left Diagonal Center -->
  <path d="M 175 190 L 256 295 L 256 325 L 175 220 Z" fill="url(#emeraldGrad)" />

  <!-- Right Diagonal Center -->
  <path d="M 337 190 L 256 295 L 256 325 L 337 220 Z" fill="url(#emeraldGrad)" />

  <!-- Golden Core Node (Signifying verified sender-recipient unity) -->
  <circle cx="256" cy="305" r="22" fill="url(#goldGrad)" filter="url(#glow)" />
  <circle cx="256" cy="305" r="10" fill="#FFFFFF" />

  <!-- Wireless Connectivity Signals (Top) -->
  <path d="M 216 140 A 55 55 0 0 1 296 140" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" />
  <path d="M 196 115 A 85 85 0 0 1 316 115" fill="none" stroke="#34D399" stroke-width="6" stroke-linecap="round" opacity="0.8" />
  <path d="M 176 90 A 115 115 0 0 1 336 90" fill="none" stroke="#34D399" stroke-width="5" stroke-linecap="round" opacity="0.4" />
</svg>
